#
# Project schema—settings that describe the book rather than any one
# rendering of it.
#
# This schema lives with the configuration library rather than with either
# tool, because it is the vocabulary the conversion and packaging halves
# have to agree on. Everything here has one right answer per book: the
# language is the language whether the output is HTML, EPUB, or a print
# PDF, and the identifier has to be the same in a cartridge manifest and
# an EPUB package document or a consumer will treat a re-import as new
# content rather than an update.
#
# Both halves may declare these inline, so a directory holding only a
# conversion config or only a packaging config still stands on its own.
#
# Field meanings:
#   keys         this node is a section; merge descends into it
#   type         this node is a setting; merge replaces it wholesale
#   default      used when no layer supplies a value
#   description  one line, written into generated sample files
#   values       permitted values, for type: enum
#   item         element type, for type: list

description: >
  Facts about the book itself, true of every rendering of it.

keys:

  identifier:
    type: ncname
    default: book
    description: >
      A name for this book that no other book anywhere will use. It is
      what an LMS matches on to recognize a re-import as the same course,
      it's what the content folder inside a package is named after, and
      two books sharing one are two books the LMS will treat as one. The
      IMS schema only requires it to be unique within the package;
      uniqueness beyond that's your responsibility and nothing will warn
      you.
      It also has to be a valid XML name, because IMS types it as xs:ID:
      start with a letter, then letters, digits, and . - _ only. No
      colons, and it may not start with a digit—which rules out both
      obvious ways of generating a unique one, since a bare UUID usually
      starts with a digit and urn:uuid: has colons.
      Reverse-DNS is the least error-prone form and reads well as a folder
      name: org.example.dept.course-code. A UUID works with a letter in
      front, which you can generate with
      python3 -c "import uuid; print('i' + uuid.uuid4().hex)".
      Whichever you choose, keep it for the life of the book. Changing it
      makes every future import a new course rather than an update.

  kind:
    type: enum
    values: [book, slides]
    default: book
    description: >
      What the folder holds: a book, whose files are its pages, or slides,
      a set of decks, each a document of its own: PowerPoint decks, each
      checked and remediated on its own, or decks written in Markdown, in
      Pandoc's slide Markdown, which only this setting says are decks. A
      folder of PowerPoint decks with nothing a book is read from (a
      README.md aside) is slides without saying so here, and the run says
      so as it starts. PowerPoint decks take format: source targets, which
      write each deck's decisions into a copy of it, and imply one,
      remediated, when none is named; html, pdf, revealjs, and markdown
      targets, which convert each deck; and a pptx target on a template
      (slides.reference_doc), which rebuilds it. Decks written in Markdown
      take html (implied when none is named), pdf, pptx, revealjs,
      markdown, and source targets. A slides folder holding both kinds
      stops the run; in a book's folder, PowerPoint decks are left out,
      and the run says so.

  title:
    type: string
    default: Untitled
    description: >
      The book's title, as it should appear to a reader.

  subtitle:
    type: string
    default: ""
    description: >
      The book's subtitle, as a reader should see it after the title. An
      EPUB records it as a second title, typed subtitle; a PDF sets it on
      its title page, and has it in its XMP; a cartridge's title has it
      after a colon.

  language:
    type: language
    default: en
    description: >
      BCP 47 language tag for the book's text. Sets the lang attribute on
      every page in it (WCAG 3.1.1) and the language declared in any
      package built from those pages; a page in another language, as its
      row in the languages sidecar or its own file says, is marked in its
      own (WCAG 3.1.2; docs/sidecars.md). Quote it: unquoted no, yes, and
      on are read as booleans by YAML. A PDF of a book in a language other than
      English needs TeX's support for the language installed, which
      docs/installation.md says how to add, Spanish's for one.

  description:
    type: text
    default: ""
    description: >
      A sentence or two about the book, used wherever a package format
      asks for one.

  doi:
    type: doi
    default: ""
    description: >
      The book's DOI, bare (10.5281/zenodo.1234567) or as its address,
      checked for its form and kept bare. An EPUB records it as an
      identifier typed DOI, after the book's own; a PDF in its XMP; a
      cartridge's manifest as an identifier in the DOI catalog.

  isbn:
    description: >
      The book's ISBNs, one for each format that has its own: each an
      ISBN-13 or an ISBN-10, its hyphens as you like, checked for its
      check digit and kept as its 13 digits, an ISBN-10 as the ISBN-13 it
      becomes. The EPUB records its own, epub, as an identifier typed
      ISBN-13, and the PDF its own, pdf, in its XMP; the others are kept for the formats TextbookImprover
      doesn't make, and for the book's records.
    keys:
      epub:
        type: isbn
        default: ""
        description: >
          The EPUB's ISBN.
      pdf:
        type: isbn
        default: ""
        description: >
          The PDF's ISBN, which its XMP gives as its identifier.
      paperback:
        type: isbn
        default: ""
        description: >
          A paperback's ISBN, where the book is printed as one.
      hardcover:
        type: isbn
        default: ""
        description: >
          A hardcover's ISBN, where the book is printed as one.

  series:
    description: >
      A series the book is part of, and its place in it. An EPUB records
      them as the collection it belongs to, a series, and its position; a
      cartridge's manifest as what it's part of.
    keys:
      name:
        type: string
        default: ""
        description: >
          The series' name.
      position:
        type: string
        default: ""
        description: >
          The book's place in the series, as a number (3, or 3.5); quote
          it.

  url:
    type: url
    default: ""
    description: >
      The book's own address, where readers find it, as an http or https
      URL. A PDF has it in its XMP, and a cartridge's manifest records it
      as an identifier in the URI catalog.

  keywords:
    type: list
    item: string
    default: []
    description: >
      Words a catalog can find the book by. An EPUB records each as a
      subject, a PDF as its keywords, and a cartridge's manifest each as a
      keyword. Where they're unset, a package's packaging.yaml keywords
      are its cartridge's, as they were, and the run says to move them
      here.

  publisher:
    type: organization
    default: ""
    description: >
      Who published the book: a name, or a mapping with name and ror, the
      organization's ROR ID (https://ror.org/05dxps055 or 05dxps055),
      checked for its checksum. An EPUB records the name as its publisher,
      as a PDF's XMP does, and a cartridge's manifest the publisher, with
      the date.

  copyright:
    type: string
    default: ""
    description: >
      The book's copyright line, as it should read (© 2026 Robert
      Szarka). An EPUB records it, with the license, as its rights; a PDF
      as its copyright; a cartridge's manifest in its rights'
      description.

  license:
    type: string
    default: ""
    description: >
      The license the book is published under, as its SPDX identifier
      where it has one (CC-BY-4.0, CC-BY-NC-SA-4.0, CC0-1.0) and otherwise
      as its name. A Creative Commons license and CC0 are known by name
      and deed; another is given as it's written. An EPUB
      records it, after the copyright line, as its rights; a PDF its
      address as its license's; a cartridge's manifest says it costs
      nothing where it's Creative Commons' or CC0, that it has conditions
      but for CC0, and names it in its rights' description. A part may
      have a license of its own (parts), read and checked and not acted
      on yet (see ROADMAP.md).

  numbering:
    type: bool
    default: false
    description: >
      Number the book's structure the way a printed book does: groups
      and top-level pages with the main role 1, 2, 3 and their pages
      1.1, 1.2; appendices A, B and A.1, A.2; front and back matter
      unnumbered. The numbers appear in the EPUB's table of contents and
      headings, the cartridge organization, the generated contents page,
      and the pages' titles.

  authors:
    type: list
    item: person
    default: []
    description: >
      Who wrote the book, one entry each: a name, as a reader should see
      it, or a mapping with name and, as you like, given and family (the
      parts of the name, which nothing works out for you), orcid (an ORCID
      iD, 0000-0002-1825-0097 or its address, checked for its check
      digit), and affiliation (a name, or a mapping with name and ror). An
      EPUB records each as a creator, an author, filed under "family,
      given" where both are given; a PDF names each as its author; a
      cartridge's manifest gives each, as a vCard, as an author. For an
      OpenStax book the publisher is usually the right entry.

  adapters:
    type: list
    item: person
    default: []
    description: >
      Who adapted another's book into this one, each written as an author
      is. An EPUB records each as a creator, an adapter, after the
      authors; a cartridge's manifest as an editor, the nearest of its
      roles.

  editors:
    type: list
    item: person
    default: []
    description: >
      Who edited the book, each written as an author is. An EPUB records
      each as a creator, an editor, after the adapters, and a cartridge's
      manifest as an editor.

  contributors:
    type: list
    item: contributor
    default: []
    description: >
      Who else had a hand in the book, each a mapping written as an
      author's is, with a role: a MARC relator, by its code (ill) or its
      term (illustrator), from the Library of Congress's list
      (https://www.loc.gov/marc/relators/relaterm.html). An EPUB records
      each as a contributor in that role; a cartridge's manifest has no
      place for one.

  passthrough:
    type: path
    default: _pt
    description: >
      A directory, inside the book's, for pages that aren't converted from
      the book's sources: an .html here is a page someone finished and is
      copied into every HTML target as it stands (and read for the EPUB),
      and an .md here is converted alongside the sources. Its files are
      treated as though they sat beside the sources, so a reference in
      _pt/about.html to images/logo.png names the book's
      images/logo.png. Every .html beside the sources is a source.

  contents:
    type: opaque
    default: []
    description: >
      The book's structure as a nested list of pages and groups. This
      describes the book, not any one package, so a cartridge
      organization and an EPUB table of contents are both built from it.
      A group or page may carry a role, front, main, appendix, or back,
      which says how it counts when numbering is on and where it belongs
      in the book; the default is main. It may also carry a type, what it
      is (preface, glossary, index, part, or another of the types EPUB's
      structural semantics name that docs/configuration.md lists; any
      other is warned of and ignored), which an EPUB marks for reading
      systems and screen
      readers; a top-level entry with no role is in the part of the book
      its type implies, and a type isn't inherited. An entry "generate: toc" is a
      page the run writes, a full table of contents with links, named
      toc unless "name" says otherwise and titled Contents unless "title"
      does.
      Left empty, tools that need an order guess one and say so.

  parts:
    type: opaque
    default: {}
    description: >
      What the project is made of, when it's more than one thing: a block
      of names, each a part with its kind, book, slides, or files (a
      folder of files that travel with the project and that no target
      uses; testbank is kept for the test banks to come). A part may name
      the file it's unpacked from, its from, as a path inside the project
      (upstream/book.zip) or as a block with file, unpacker (cartridge,
      cnx, epub, jekyll, site, or archive), and options, the unpacker's
      options that change what it writes; and a license, when the part's
      isn't the book's. A part's name is a lowercase letter, then
      lowercase letters, digits, - and _. In a project with a folder for
      each part under src/, a part's kind is what its run takes it for,
      and a project that names no parts has one, the folder src/ holds;
      with more than one folder there the run stops and asks for them.
      A part may have an identifier, title, contents, and numbering of
      its own, which its run takes in place of the project's: a second
      book in a project (an instructor's version beside the student's)
      is then another course to an LMS, with its own order. Where a
      part has none, the project's is used, but for a part that isn't a
      book (decks), which gets no contents or numbering it doesn't set. An
      unpacker given --part writes the part's from, and a run unpacks
      the file it names into the part's folder under src/ when that
      folder holds nothing, and says afterwards when the folder no
      longer matches it (convert.py --src-status lists how). A part's
      license is read and checked, and no run acts on it yet (see
      ROADMAP.md).

  include:
    type: list
    item: path
    default: []
    description: >
      Files at the top of the project's folder that travel with it, a
      README or a notes file, each a path from there. Read and checked;
      not acted on yet (see ROADMAP.md).
